name: CI

on:
  push:
    branches:
      - dev
      - main
  pull_request:
    branches:
      - dev
      - main

permissions:
  contents: read

jobs:
  lint-test-build:
    runs-on: ubuntu-latest
    env:
      # Default to dev for PRs/dev branch
      VITE_ENABLE_DEV_PANEL: ${{ github.ref == 'refs/heads/main' && '0' || '1' }}
      VITE_ENABLE_SCENARIO_EDITOR: ${{ github.ref == 'refs/heads/main' && '0' || '1' }}
      VITE_ENABLE_TELEMETRY_EXPORT: ${{ github.ref == 'refs/heads/main' && '0' || '1' }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run test
      - run: npm run build
